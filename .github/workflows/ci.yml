name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # the release workflow runs this gate on the tagged commit

jobs:
  dry-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # baselines are tags: a shallow clone cannot be judged
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: |
          uv run pytest -q
          uv run python tests/check_coverage.py
          node --test tests/browser/*.test.cjs
      - name: Wheel carries the package data
        run: |
          uv build --package qmstrace --wheel --no-sources --quiet
          uv run python tests/check_wheel.py
      - name: Manual
        run: uv run --isolated --locked --only-group docs zensical build --clean

  windows-cross-drive:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install candidate
        run: uv sync --locked
      - name: Native distinct-drive acceptance
        run: uv run python tests/check_cross_drive.py

  installed-plugins:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install build and verification tools
        run: uv sync --locked
      - name: Build distributions independently
        run: |
          uv build --package qmstrace --wheel --no-sources
          uv build --package qmstrace-lang-csharp --wheel --no-sources
          uv build --package qmstrace-lang-python --wheel --no-sources
      - name: Prepare dependency wheelhouse
        run: uv run python tests/check_plugin_wheels.py --prepare
      - name: Offline installed-wheel compatibility
        run: uv run python tests/check_plugin_wheels.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-compatibility-${{ matrix.os }}
          path: |
            dist/compatibility-*.json
            dist/*.whl
