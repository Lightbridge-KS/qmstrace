name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dry-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # baselines are tags: a shallow clone cannot be judged
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: |
          uv run pytest -q
          node --test tests/browser/*.test.cjs
      - name: Wheel carries the package data
        run: |
          uv build --wheel --quiet
          uv run python tests/check_wheel.py
      - name: Manual
        run: uv run --isolated --locked --only-group docs zensical build --clean
