name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dry-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # baselines are tags: a shallow clone cannot be judged
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q
      - name: Wheel carries the package data
        run: |
          uv build --wheel --quiet
          uv run python -c "import glob, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'qmstrace/assets/README.md' in names, names"
