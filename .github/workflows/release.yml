name: release

# Annotated host/plugin tags select independent manifests. CI drafts; a human publishes.
on:
  push:
    tags: ['v*', 'qmstrace-lang-csharp-v*', 'qmstrace-lang-python-v*']

jobs:
  gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  draft:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install locked verification tools
        run: uv sync --locked
      - name: Check annotated tag and selected manifest; prepare package notes
        id: release
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          uv run python scripts/release_metadata.py "$GITHUB_REF_NAME" --notes notes.md --output metadata.txt
          cat metadata.txt >> "$GITHUB_OUTPUT"
      - name: Build selected distribution without workspace overrides
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: uv build --package "$PACKAGE" --wheel --no-sources
      - name: Draft private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
          WHEEL: ${{ steps.release.outputs.wheel }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$PACKAGE $VERSION" --notes-file notes.md "dist/$WHEEL"
