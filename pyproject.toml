[project]
name = "qmstrace"
version = "0.1.0"
description = "The trace layer under a quality-management system: state, traceability and audit evidence for a software project's work products."
authors = [
    { name = "Lightbridge-KS", email = "ki11ip0.s.a.s@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-c-sharp>=0.23.5,<0.24",
    "typer>=0.27.2",
]

[project.scripts]
qmstrace = "qmstrace.cli:app"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-defusedxml>=0.7.0.20260504",
]
docs = [
    "zensical>=0.0.63",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["tests/fixtures"]  # product repos for the engine to read, not our code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"  # the import matrix is checked on absolute names

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
markers = ["verifies(*ids): trace the items this test actually verifies"]
testpaths = ["tests"]
addopts = "--strict-markers --cov=qmstrace --cov-report=term-missing:skip-covered --cov-fail-under=90"
