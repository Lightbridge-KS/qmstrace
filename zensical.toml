# The user manual — source in contents/ (docs/ is the repo's internal memory and is never
# published). Scaffolded with `zensical new`, then adapted. Build: `just manual-build`.
[project]
site_url = "https://qmstrace.netlify.app/"
site_name = "qmstrace"
site_description = "The trace layer under a quality-management system"
docs_dir = "contents"
strict = true                        # a broken link or anchor fails the build

# copyright = "Copyright &copy; 2026 Your name"

# Set when the repository goes public — until then an edit link would lead nowhere.
# repo_url = "https://github.com/Lightbridge-KS/qmstrace"
# repo_name = "Lightbridge-KS/qmstrace"
# edit_uri = "edit/main/contents/"

nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    { "A first look" = "tutorials/first-look.md" },
  ] },
  { "How-to guides" = [
    { "Check your work" = "how-to/check-your-work.md" },
    { "Write an impact list" = "how-to/write-an-impact-list.md" },
    { "Read test results" = "how-to/read-test-results.md" },
    { "Change a frozen item" = "how-to/change-a-frozen-item.md" },
    { "Review downstream suspects" = "how-to/review-suspects.md" },
  ] },
  { "Reference" = [
    { "qmstrace status" = "reference/commands/status.md" },
    { "qmstrace thread" = "reference/commands/thread.md" },
    { "qmstrace impact" = "reference/commands/impact.md" },
    { "qmstrace results" = "reference/commands/results.md" },
    { "qmstrace check" = "reference/commands/check.md" },
    { "qmstrace rules" = "reference/commands/rules.md" },
    { "Findings" = "reference/findings.md" },
    { "Exit codes" = "reference/exit-codes.md" },
    { "Configuration" = "reference/configuration.md" },
    { "Baselines and change control" = "reference/baselines.md" },
    { "Downstream suspects" = "reference/suspects.md" },
  ] },
  { "Explanation" = [
    { "The chain" = "explanation/the-chain.md" },
    { "Kinds of finding" = "explanation/kinds-of-finding.md" },
    { "Around the repo" = "explanation/around-the-repo.md" },
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# Reference pages include files that tests own — goldens and fixtures — never restated text.
# Paths are relative to tests/, the only folder a page may include from; a missing file fails.
pymdownx.snippets.base_path = ["tests"]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
