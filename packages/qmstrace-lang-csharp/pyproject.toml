[project]
name = "qmstrace-lang-csharp"
version = "0.1.0"
description = "C# and Razor trace extraction for qmstrace API v1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["qmstrace>=0.4.0", "tree-sitter>=0.26,<0.27", "tree-sitter-c-sharp>=0.23.5,<0.24"]

[project.entry-points."qmstrace.extractors"]
csharp = "qmstrace_lang_csharp"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
qmstrace = { workspace = true }
