[project]
name = "qmstrace-lang-python"
version = "0.1.0"
description = "Python module and pytest trace extraction for qmstrace API v1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["qmstrace>=0.4.0"]

[project.entry-points."qmstrace.extractors"]
python = "qmstrace_lang_python"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
qmstrace = { workspace = true }
